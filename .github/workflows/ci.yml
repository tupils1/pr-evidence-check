name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fail if dist is out of date
        run: git diff --exit-code -- dist
      - name: Confirm the bundle does not call an LLM
        run: |
          if grep -E -i 'api\.openai\.com|api\.anthropic\.com|generativelanguage\.googleapis' dist/index.js; then
            echo "LLM endpoint found in dist" >&2
            exit 1
          fi
