name: Jest

on:
  pull_request:

permissions:
  contents: read

jobs:
  jest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run jest
        run: npx --yes jest@29 --ci --colors=false --watchman=false fixtures/jest-sample.test.js
